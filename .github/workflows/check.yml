name: Check

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "ci/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive

      # Every folder with .tf files is a module; each is initialized without a backend and validated on its own.
      - name: Validate
        run: |
          for module in $(find . -name '*.tf' -not -path './.git/*' -exec dirname {} \; | sort -u); do
            echo "::group::${module}"
            tofu -chdir="${module}" init -backend=false -input=false
            tofu -chdir="${module}" validate
            echo "::endgroup::"
          done
